name: EAS Android production

# Needs a release keystore on EAS first: run `eas credentials -p android` (or one
# interactive `eas build -p android --profile production`) once, because EAS will
# not generate a keystore in --non-interactive mode. Auto-submit to Google Play
# needs a Play service account key on EAS and one manual first upload of an .aab.

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Upload to the Play Console internal track after building"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add an EXPO_TOKEN repository secret (expo.dev → Access tokens)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - run: eas build -p android --profile production --non-interactive --wait --freeze-credentials ${{ inputs.submit && '--auto-submit' || '' }}
